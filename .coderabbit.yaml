version: 2
language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "backend-java/src/main/java/**"
      instructions: |
        Strictly verify financial invariants:
        1. REJECT any float/double primitive used for monetary attributes,
           balances, or FX rates — everything must be BigDecimal or
           javax.money.MonetaryAmount. Integer division on money is forbidden.
        2. All balance updates must execute through double-entry legs
           (debit == credit) inside LedgerService — no direct balance writes.
        3. Cross-currency transfers must route through clearing accounts.
        4. UBO circular ownership checks (HTTP 403) must never be bypassed.
        5. No funds can move to SETTLED without third-party HMAC webhook
           verification — flag any manual/admin settle path.
        6. Mutating endpoints must be covered by the idempotency filter —
           flag any ledger mutation reachable outside the dedup/claim path.
        7. Multi-leg operations (fund/settle/cancel) must run inside a
           single atomic transaction — flag partial-commit sequences.
        8. Idempotency identity must derive from raw Authorization-header
           hashes, never unverified JWT claims. Auth routes must stay
           excluded from the response cache. Bodies over 64 KB -> 413.
        9. Sensitive fields (tax IDs, webhook secrets) must stay behind the
           AES-256-GCM JPA converter — flag any new plaintext column.
    - path: "backend-java/src/test/**"
      instructions: |
        FLAG any use of Thread.sleep or timing-based synchronization — tests
        must be deterministic (latches/barriers). FLAG fakes that bypass
        LedgerService or the escrow state machine to make assertions pass.
    - path: "frontend/src/**"
      instructions: |
        FLAG monetary arithmetic done in TypeScript numbers — amounts are
        wire strings and must only be formatted, never computed client-side.
        FLAG new fetch/axios calls that hardcode URLs instead of using the
        shared api client with VITE_API_BASE_URL.
    - path: "frontend/e2e/**"
      instructions: |
        Webhook simulations must send properly HMAC-signed
        X-Hub-Signature-256 payloads — flag unsigned settlement attempts.
