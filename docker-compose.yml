services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wise
      POSTGRES_PASSWORD: wise
      POSTGRES_DB: wise_escrow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise -d wise_escrow"]
      interval: 2s
      timeout: 3s
      retries: 20
