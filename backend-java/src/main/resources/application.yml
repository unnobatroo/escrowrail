spring:
  application:
    name: wise-escrow-java
  jackson:
    # Wire format stays snake_case — the SPA contract from the Python
    # service is unchanged.
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wise_escrow}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      # Schema is Flyway-owned (db/migration) — Hibernate only verifies
      # the entities match. Never `update` on a funds ledger.
      ddl-auto: validate
    open-in-view: false
  modulith:
    events:
      jdbc-schema-initialization:
        # event_publication DDL lives in V1__init.sql like everything else.
        enabled: false

server:
  port: ${PORT:8080}

wise:
  jwt:
    # HS256 shared secret, >= 32 bytes. No default — the app refuses to
    # boot without JWT_SECRET in the environment.
    secret: ${JWT_SECRET:}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  webhooks:
    # Settlement webhooks release real funds — a blank secret DISABLES the
    # endpoint (calls are rejected), so any environment that accepts
    # webhooks must set these.
    github-secret: ${WISE_GITHUB_WEBHOOK_SECRET:}
    logistics-secret: ${WISE_LOGISTICS_WEBHOOK_SECRET:}
  cors:
    # Comma-separated SPA origins allowed to call the API. Prod sets
    # WISE_CORS_ORIGINS to the deployed Vercel frontend URL(s).
    allowed-origins: ${WISE_CORS_ORIGINS:http://localhost:5173}
  encryption:
    # AES-256 field-encryption key (base64, 32 bytes). The default is a
    # published dev-only key — prod must set WISE_FIELD_ENCRYPTION_KEY.
    key: ${WISE_FIELD_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  seed:
    enabled: ${WISE_SEED_ENABLED:true}
    password: ${WISE_SEED_PASSWORD:WiseDemo123!}
  demo:
    # Sandbox gateway surface: /api/v1/demo/** (config, top-ups, signed
    # webhook simulation). Disable in hardened environments.
    enabled: ${WISE_DEMO_ENABLED:true}
    buyer-email: ${WISE_DEMO_BUYER_EMAIL:buyer@demo.com}
    seller-email: ${WISE_DEMO_SELLER_EMAIL:seller@demo.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
