name: PR Verify

on:
  pull_request:
    branches: [main]

jobs:
  quality-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -e ".[dev,test]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check . --output-format=github
      - name: Type check
        run: mypy --strict .
      - name: Dependency security audit
        run: pip-audit --desc --skip-editable

  # Fan-in gate so branch protection can require the stable name
  # `quality` instead of per-matrix check names like `quality (3.11)`.
  quality:
    needs: quality-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "quality matrix passed"

  unit-and-invariants-matrix:
    needs: quality-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -e ".[dev,test]"
      - name: Unit tests
        run: >
          pytest -v --tb=short --junitxml=pytest-report.xml
          --ignore=tests/test_invariants.py
          --ignore=tests/test_concurrency_and_load.py
          --ignore=tests/test_synthetic_traffic.py
      - name: Invariant fuzz tests
        run: pytest -v --tb=short tests/test_invariants.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-report-unit-${{ matrix.python-version }}
          path: pytest-report.xml

  unit-and-invariants:
    needs: unit-and-invariants-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "unit and invariant matrix passed"

  concurrency-and-load-matrix:
    needs: quality-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -e ".[dev,test]"
      - name: Concurrency and synthetic traffic tests
        run: >
          pytest -v --tb=short --junitxml=pytest-report.xml
          tests/test_concurrency_and_load.py
          tests/test_synthetic_traffic.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-report-concurrency-${{ matrix.python-version }}
          path: pytest-report.xml

  concurrency-and-load:
    needs: concurrency-and-load-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "concurrency and load matrix passed"
