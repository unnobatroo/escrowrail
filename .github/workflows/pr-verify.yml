name: PR Verify

on:
  pull_request:
    branches: [main, "feat/*"]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Backend check (Testcontainers + Postgres)
        run: cd backend-java && ./gradlew check

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Playwright webServer boots the Spring backend — needs JDK 21 too.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend + Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: cd frontend && npm run build
      - name: E2E (Java backend + Postgres + Vite)
        run: cd frontend && npx playwright test
