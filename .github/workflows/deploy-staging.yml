name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escrowrail
          POSTGRES_PASSWORD: escrowrail
          POSTGRES_DB: escrowrail_escrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escrowrail -d escrowrail_escrow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t escrowrail-backend backend-java
      - name: Boot container
        run: |
          docker run -d --name backend -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL='jdbc:postgresql://host.docker.internal:5432/escrowrail_escrow' \
            -e SPRING_DATASOURCE_USERNAME=escrowrail \
            -e SPRING_DATASOURCE_PASSWORD=escrowrail \
            -e JWT_SECRET='ci-secret-ci-secret-ci-secret-ci-32' \
            -e ESCROWRAIL_FIELD_ENCRYPTION_KEY='MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' \
            -e ESCROWRAIL_GITHUB_WEBHOOK_SECRET='ci-gh-secret' \
            -e ESCROWRAIL_LOGISTICS_WEBHOOK_SECRET='ci-logi-secret' \
            escrowrail-backend
      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; docker logs backend; exit 1
