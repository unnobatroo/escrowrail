name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and build tools
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -e ".[dev,test]" build
      - name: Build wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/
      - name: Boot application
        run: |
          rm -f escrowrail_escrow.db
          nohup uvicorn app.main:app --port 8619 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8619/health/live && break
            sleep 1
          done
      - name: Seed demo data
        run: python scripts/seed_demo_data.py
      - name: Smoke test
        run: BASE_URL=http://localhost:8619 python scripts/smoke_test.py
      - name: Verify probes
        run: |
          curl -sf http://localhost:8619/health/live | grep alive
          curl -sf http://localhost:8619/health/ready | grep '"ledger_balanced":true'
          curl -sf http://localhost:8619/metrics | grep escrow_contracts_created_total
      - name: Shutdown application
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-uvicorn-log
          path: uvicorn.log
