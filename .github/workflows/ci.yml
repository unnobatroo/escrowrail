name: CI & Ledger Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,test]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Strict Type Check (mypy)
        run: |
          mypy --strict .

      - name: Security Audit (runtime dependencies)
        run: |
          pip-audit --desc --skip-editable

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short --junitxml=pytest-report.xml

      - name: Upload JUnit Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
