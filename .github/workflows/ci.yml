name: CI & Escrow Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "feat/*" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend compile + static analysis
        run: cd backend-java && ./gradlew assemble check -x test
      - name: Frontend lint + typecheck + build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Backend test suite (Testcontainers + Postgres)
        run: cd backend-java && ./gradlew clean test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-reports
          path: backend-java/build/test-results/test/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend + Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: SaaS E2E flow (Java backend + Postgres + Vite)
        run: cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
