name: CI & Ledger Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-asyncio httpx respx sqlmodel pip-audit

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Strict Type Check (mypy)
        run: |
          mypy --strict .

      - name: Security Audit
        run: |
          pip-audit

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short
