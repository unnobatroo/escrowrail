name: Keep-alive

# Free-tier Container Apps scales to zero after ~5 min idle; the next request
# pays a 30-60s cold start. Ping health so the replica rarely sleeps.
# shortcut: GitHub cron is best-effort (can lag under load); if login latency
# matters for a demo, set minReplicas=1 on the app instead (~$15/mo).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 90 --retry 2 \
            https://escrowrail-api.thankfulglacier-adbe2ba9.swedencentral.azurecontainerapps.io/actuator/health
